<!-- Declara o documento como HTML5. -->
<!DOCTYPE html>
<!-- Documento do painel administrativo em português. -->
<html lang="pt-BR">

<!-- Metadados e recursos visuais compartilhados. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestão de Manutenção</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

    body {
        font-family: 'Inter', sans-serif;
        scroll-behavior: smooth;
    }

    /* Animação suave para o banner de status no QR Code */
    @keyframes pulseGlow {
        0% {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
        }

        70% {
            box-shadow: 0 0 15px 10px rgba(239, 68, 68, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
    }

    .alert-pulse {
        animation: pulseGlow 2s infinite;
    }

    /* Efeito Glassmorphism (Vidro Fosco) para os modais */
    .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* Custom Scrollbar moderna */
    ::-webkit-scrollbar {
        width: 8px;
    }

    ::-webkit-scrollbar-track {
        background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
    }
</style>

<!-- Área principal do dashboard protegido. -->
<body class="app-page bg-slate-50 text-slate-800">

    <!-- Botão de hambúrguer que abre a navegação no celular. -->
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Abrir menu" aria-controls="appSidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>

    <!-- Navegação lateral com ícones e links principais. -->
    <aside id="appSidebar" class="app-sidebar" aria-label="Navegação principal">
        <div class="sidebar-brand">
            <img src="/favicon.svg" alt="">
            <div class="sidebar-brand-text">
                <strong>PrevSystem</strong>
                <span>Gestão preventiva</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="sidebar-link is-active" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
                <span>Dashboard</span>
            </a>
            <a href="/computers.html" class="sidebar-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
                <span>Computadores</span>
            </a>
            <a href="/qr-scanner.html?code=PC-ABC-0001" class="sidebar-link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM18 18h3v3h-3zM14 20h2"></path></svg>
                <span>QR Scanner</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="sidebar-logout" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 16l4-4-4-4M18 12H9"></path></svg>
                <span>Sair</span>
            </button>
        </div>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay" aria-hidden="true"></div>

    <!-- Container Principal -->
    <main class="app-main max-w-7xl mx-auto p-6 responsive-main">
        <div class="mobile-page-header flex justify-between items-center mb-6 responsive-heading">
            <h1 class="text-2xl font-bold">Computadores Monitorados</h1>
            <a href="/computers.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition-all">Abrir Cadastro</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 responsive-card-grid">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                <p class="text-sm text-slate-500">Ativos cadastrados</p>
                <p id="totalComputers" class="text-3xl font-bold text-slate-800 mt-2">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                <p class="text-sm text-slate-500">Em dia</p>
                <p id="totalEmDia" class="text-3xl font-bold text-emerald-600 mt-2">0</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                <p class="text-sm text-slate-500">Atrasados</p>
                <p id="totalAtrasados" class="text-3xl font-bold text-red-600 mt-2">0</p>
            </div>
        </div>

        <!-- Tabela de Computadores -->
        <div class="table-scroll bg-white rounded-lg shadow overflow-hidden">
            <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-slate-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Código</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Nome</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody id="computersTableBody" class="bg-white divide-y divide-slate-200">
                    <!-- Linhas renderizadas via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal para exibir o QR Code -->
    <div id="qrModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg text-center max-w-sm w-full relative">
            <button id="closeQrModalBtn" type="button"
                class="absolute top-2 right-4 text-xl font-bold text-slate-500 hover:text-slate-800">&times;</button>
            <h2 class="text-lg font-bold mb-4" id="qrModalTitle">QR Code</h2>
            <img id="qrImage" src="" alt="QR Code" class="mx-auto mb-4 border p-2 rounded">
            <a id="qrDownloadBtn" href="" download="qrcode.png"
                class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 w-full block">Baixar QR
                Code</a>
            <a id="qrLink" href="" target="_blank" class="text-blue-500 text-sm mt-4 block hover:underline">Abrir Página
                do PC</a>
        </div>
    </div>

    <!-- Disponibiliza autenticação e requisições para o script da página. -->
    <script src="/js/api.js"></script>
    <script>
        // Impede acesso ao dashboard sem JWT.
        checkAuth();
        setupSidebar();

        function logout() {
            localStorage.removeItem('prev_token');
            if (window.sessionStorage) {
                sessionStorage.clear();
            }
            window.location.replace('/index.html');
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Busca computadores e atualiza contadores, tabela e ações.
        async function loadComputers() {
            try {
                const computers = await fetchAPI('/computers');
                const tbody = document.getElementById('computersTableBody');
                tbody.innerHTML = '';

                document.getElementById('totalComputers').textContent = computers.length;
                document.getElementById('totalEmDia').textContent = computers.filter(pc => pc.status === 'EM_DIA').length;
                document.getElementById('totalAtrasados').textContent = computers.filter(pc => pc.status === 'ATRASADO').length;

                if (!computers.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-sm text-slate-500">Nenhum computador cadastrado. <a href="/computers.html" class="text-blue-600 font-semibold underline">Cadastre o primeiro</a>.</td></tr>';
                    return;
                }

                computers.forEach(pc => {
                    let statusBadge = '';
                    if (pc.status === 'EM_DIA') statusBadge = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Em Dia</span>';
                    if (pc.status === 'ATRASADO') statusBadge = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Atrasado</span>';
                    if (pc.status === 'EM_MANUTENCAO') statusBadge = '<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">Em Manutenção</span>';

                    tbody.innerHTML += `
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900">${pc.unique_code}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">${pc.name}</td>
              <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                <button type="button" data-computer-code="${pc.unique_code}" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 px-3 py-1 rounded">Gerar QR Code</button>
              </td>
            </tr>
          `;
                });
            } catch (err) {
                alert('Erro ao carregar computadores');
            }
        }

        async function showQRCode(code) {
            try {
                const data = await fetchAPI(`/computers/${code}/qrcode`);
                document.getElementById('qrModalTitle').innerText = `QR Code - ${code}`;
                document.getElementById('qrImage').src = data.image; // Base64 retornado pelo backend
                document.getElementById('qrDownloadBtn').href = data.image;
                document.getElementById('qrLink').href = data.url;
                document.getElementById('qrModal').classList.remove('hidden');
            } catch (err) {
                alert('Erro ao gerar QR Code');
            }
        }

        function closeQrModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        // Abre o QR Code sem usar onclick inline bloqueado pelo Helmet CSP.
        document.getElementById('computersTableBody').addEventListener('click', (event) => {
            const button = event.target.closest('button[data-computer-code]');
            if (button) showQRCode(button.dataset.computerCode);
        });

        // Fecha o modal por um listener seguro e explícito.
        document.getElementById('closeQrModalBtn').addEventListener('click', closeQrModal);

        // Carrega os dados ao abrir a página
        loadComputers();
    </script>
</body>

</html>
